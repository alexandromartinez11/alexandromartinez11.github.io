<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alexandro Martinez</title>
  <style>
    :root { --bg:#030806; --text:#9dffb8; --dim:#4f9c68; --accent:#39ff6a; --amber:#ffb000; --link:#5cf0ff; --line:#1f5a35; }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0 auto; max-width: 800px; padding: 36px 20px 70px;
      color: var(--text); background: var(--bg);
      font-family: "VT323", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.15rem; line-height: 1.5;
      text-shadow: 0 0 6px rgba(57,255,106,.35);
    }
    /* CRT scanlines + vignette over everything */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 10;
      background:
        repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.28) 3px),
        radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%);
    }
    .screen { border: 2px solid var(--line); border-radius: 10px; padding: 22px 24px 28px;
      box-shadow: 0 0 24px rgba(57,255,106,.15), inset 0 0 30px rgba(57,255,106,.06); animation: flicker .6s ease-out 1; }
    @keyframes flicker { 0%{opacity:0} 20%{opacity:.9} 35%{opacity:.4} 55%{opacity:1} 70%{opacity:.8} 100%{opacity:1} }

    .hero { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-bottom: 10px; }
    .hero img { width: 140px; height: 140px; object-fit: cover; object-position: 50% 25%; border-radius: 8px; border: 2px solid var(--accent);
      box-shadow: 0 0 16px rgba(57,255,106,.35); }
    h1 { color: var(--accent); font-weight: normal; font-size: 2.4rem; line-height: 1.1; margin: 0 0 4px; text-shadow: 0 0 10px rgba(57,255,106,.5); }
    .role { color: var(--amber); font-size: 1.4rem; margin: 0 0 4px; }
    h2 { color: var(--amber); font-weight: normal; font-size: 1.5rem; margin: 34px 0 6px; text-shadow: 0 0 8px rgba(255,176,0,.45); }
    h2::before { content: "[ "; } h2::after { content: " ]"; }
    h2 + * { border-top: 1px dashed var(--line); padding-top: 10px; }
    h3 { color: var(--accent); font-weight: normal; font-size: 1.25rem; margin: 18px 0 0; }
    h3::before { content: "> "; color: var(--dim); }
    .meta { color: var(--dim); margin: 0 0 6px; }
    ul { list-style: none; padding-left: 0; margin: 6px 0 0; }
    li { padding-left: 1.4em; text-indent: -1.4em; margin-bottom: 6px; }
    li::before { content: "+ "; color: var(--amber); }
